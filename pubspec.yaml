name: aidentification_app
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.13.7

dependencies:
  # general
  cached_network_image: ^4.0.6

  # mobile-only
  camera: ^0.12.2
  cupertino_icons: ^2.0.0

  # general
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1

  # web-only
  fl_chart: ^0.70.2
  web: ^1.1.1

  # mobile-only
  flutter_launcher_icons: ^0.14.4
  flutter_onnxruntime: ^1.9.0
  geolocator: ^14.1.2

  # general
  http: ^1.6.0
  http_parser: ^4.0.2

  # mobile-only
  image: ^4.12.0
  image_picker: ^1.2.3
  path: ^1.8.3
  path_provider: ^2.1.5
  permission_handler: ^13.0.2
  rename_app: ^1.6.6

  # general
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.18.3
  provider: ^6.1.2

dev_dependencies:
  # general
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/icon/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.jpeg"